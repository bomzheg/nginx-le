# Front proxy role.
#
# Mount this file INSTEAD of services.conf on the machine that stands in front:
# see docker-compose.override.yml.example. The origin machine keeps services.conf.
#
# browser --https--> this machine --https--> origin
#
# TLS is terminated here, so the certificate for every domain in this file must be
# issued here as well: LE_FQDN of this machine lists exactly the server_name values
# below, and every server block serves its own ACME challenge (include ./acme.conf).
# Nothing is forwarded to the origin's ACME webroot — the origin issues only for the
# domains that resolve to the origin.
#
# The origin's address is never published: "nemesis.internal" below is not a DNS name,
# it is an extra_hosts entry in docker-compose.override.yml, which stays out of git.
# No public record may point at the origin — a DNS-only ("grey cloud") record would
# hand its address to anyone who asks. That is also why the origin's own public name
# stays behind its CDN and is not used for this hop.

server {
    listen 80;
    listen   443 ssl;
    server_name hestia.bomzheg.dev;

    ssl_certificate         SSL_CERT;
    ssl_certificate_key     SSL_KEY;
    ssl_trusted_certificate SSL_CHAIN_CERT;

    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload";

    limit_conn perip 20;
    client_max_body_size 50m;

    access_log off;

    include ./acme.conf;

    root   /usr/www/html/;

    # served by this machine, not proxied anywhere. To publish the control panel
    # running on the docker host instead of the static root, replace root above with:
    #
    # location / {
    #     proxy_pass https://host.docker.internal:8083;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

server {
    listen 80;
    listen   443 ssl;
    server_name shvatka.bomzheg.dev shvatka-test.bomzheg.dev;

    ssl_certificate         SSL_CERT;
    ssl_certificate_key     SSL_KEY;
    ssl_trusted_certificate SSL_CHAIN_CERT;

    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload";

    limit_conn perip 20;
    client_max_body_size 50m;

    access_log off;

    # must stay above location / — the challenge is answered here, by the machine
    # that owns these certificates, and never travels to the origin
    include ./acme.conf;

    location / {
        # literal name on purpose: nginx resolves it once at startup through the
        # system resolver, which reads /etc/hosts and therefore the extra_hosts
        # entry. A variable here would go to the "resolver" in nginx.conf instead
        # and never find an internal-only name. Recreate the container after
        # changing the address.
        proxy_pass https://nemesis.internal;

        # the origin routes by Host, so it still sees the real domain
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header  Authorization $http_authorization;
        proxy_pass_header Authorization;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The connection goes to an address nobody can look up, but the certificate
        # is checked against the origin's real public name, which Let's Encrypt
        # already issued there. That keeps the hop verified without a self-signed
        # certificate and without publishing the origin's address.
        proxy_ssl_server_name on;
        proxy_ssl_name nemesis.bomzheg.dev;

        # nginx does NOT verify upstream certificates by default — this turns it on
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        # If the origin's certificate ever stops matching, drop to "off": the hop
        # stays encrypted, only unauthenticated. Do not swap in a self-signed
        # certificate for this.
    }
}
