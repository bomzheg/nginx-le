server {
    listen 80;
    listen   443 ssl;
    server_name nemesis.bomzheg.dev;

    ssl_certificate         SSL_CERT;
    ssl_certificate_key     SSL_KEY;
    ssl_trusted_certificate SSL_CHAIN_CERT;

    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload";

    limit_conn perip 20;
    client_max_body_size 50m;

    access_log off;

    include ./bots/*.conf;

    root   /usr/www/html/;
}

server {
    listen 80;
    listen   443 ssl;
    server_name shvatka-test.bomzheg.dev;

    ssl_certificate         SSL_CERT;
    ssl_certificate_key     SSL_KEY;
    ssl_trusted_certificate SSL_CHAIN_CERT;

    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload";

    limit_conn perip 20;
    client_max_body_size 50m;

    access_log off;


    location ~ ^/(api|cdn)/ {
            set $cors '';
            set $cors_origin "";
            set $cors_cred   "";
            set $cors_method "";
            set $cors_header "";


                set $cors_cred 'true';
                set $cors_method 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
                set $cors_header 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With';

                #set $cors_origin "http://localhost:4200";
                set $cors_origin "https://shvatka-test.bomzheg.dev";


                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Credentials' $cors_cred always;
                add_header 'Access-Control-Allow-Methods' $cors_method always;
                add_header 'Access-Control-Allow-Headers' $cors_header always;

                # required to be able to read Authorization header in frontend
                #add_header 'Access-Control-Expose-Headers' 'Authorization' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Credentials' $cors_cred always;
                add_header 'Access-Control-Allow-Methods' $cors_method always;
                add_header 'Access-Control-Allow-Headers' $cors_header always;
                # Tell client that this pre-flight info is valid for 20 days
                add_header 'Access-Control-Max-Age' 1; # 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
           }

            proxy_set_header  Authorization $http_authorization;
            proxy_pass_header Authorization;

            resolver 127.0.0.11 valid=30s;
            set $u_sh_test shvatka-test;
            proxy_pass http://$u_sh_test:80;
        }

        location / {
            resolver 127.0.0.11 valid=30s;
            set $u_sh_test_ui shvatka_ui-test;
            proxy_pass http://$u_sh_test_ui:80;
        }
}


