# include this file to every server partition listening on port 80,
# otherwise "location /" of that vhost swallows the ACME challenge and
# certbot renewal fails with "unauthorized" / 404.
#
# certbot inside the container runs with "--webroot -w /usr/share/nginx/html",
# so the challenge files must be served from that directory, locally.
location ^~ /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
    default_type "text/plain";
    access_log off;
}
